<!doctype html>
<!-- Site icon. Render with: python3 tools/og/render-icon.py  →  assets/icon-{48,180,192}.png -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:192px;height:192px;background:transparent}
  .i{width:192px;height:192px;border-radius:40px;background:#0E1524;display:grid;place-items:center;position:relative;overflow:hidden}
  .i b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:150px;line-height:1;color:#E8EDF7;letter-spacing:-.04em;margin-top:-10px}
  .i i{position:absolute;right:34px;bottom:38px;width:30px;height:30px;border-radius:50%;background:#7FA3F5}
  .i u{position:absolute;left:0;right:0;bottom:0;height:12px;background:#E49151}
</style></head>
<body><div class="i"><b>B</b><i></i><u></u></div></body></html>
