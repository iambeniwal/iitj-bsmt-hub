# Supabase pauses a free project after 7 days without activity, and a
# paused project means nobody can sign in until it's resumed by hand.
# Every three days this makes one small public read, which counts as
# activity. It uses only the publishable key, which is public anyway.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 */3 * *"     # 03:17 UTC (08:47 IST) every third day
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one announcement id
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wrzxexhincklabhadhmk.supabase.co/rest/v1/announcements?select=id&limit=1" \
            -H "apikey: sb_publishable_6D3-SW5iw-YDoeWmkvPaag_c5Y150nq")
          echo "Supabase answered $code"
          test "$code" = "200"
